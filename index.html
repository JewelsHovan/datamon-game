<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Compass: Cardinal Clash</title>
    <!-- App shell (spec 014): icons, install manifest and link previews. Icons and share.png come from art/pipeline/app_icons.py. -->
    <meta name="description" content="A pixel-art fighting game in your browser: pick a Compass colleague and battle a friend or the CPU, best of three rounds." />
    <meta name="theme-color" content="#0b0a1f" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Cardinal Clash" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Compass: Cardinal Clash" />
    <meta property="og:title" content="Compass: Cardinal Clash" />
    <meta property="og:description" content="A pixel-art fighting game in your browser: pick a Compass colleague and battle a friend or the CPU, best of three rounds." />
    <meta property="og:url" content="https://datamon-game.julienh15.workers.dev/" />
    <meta property="og:image" content="https://datamon-game.julienh15.workers.dev/share.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="COMPASS: CARDINAL CLASH in gold pixel letters over four pixel-art fighters squaring off, two a side." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Compass: Cardinal Clash" />
    <meta name="twitter:description" content="A pixel-art fighting game in your browser: pick a Compass colleague and battle a friend or the CPU, best of three rounds." />
    <meta name="twitter:image" content="https://datamon-game.julienh15.workers.dev/share.png" />
    <meta name="twitter:image:alt" content="COMPASS: CARDINAL CLASH in gold pixel letters over four pixel-art fighters squaring off, two a side." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Not render-blocking: a slow font fetch must not hold the game script (it draws LOADING and waits for the font itself). data-failed tells it the font could not load (spec 014 failure screen). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" media="print" onload="this.media='all'" onerror="this.dataset.failed='1'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" /></noscript>
    <script>
      // Spec 014 failure screen, for the one failure the game's own code cannot catch: its script
      // (or a chunk it imports) failing to load or throwing before the game has started.
      addEventListener(
        "error",
        function (e) {
          var t = e.target;
          var script = t && t.tagName === "SCRIPT";
          var ours = e instanceof ErrorEvent && typeof e.filename === "string" && e.filename.indexOf(location.origin) === 0;
          if (window.__game || !(script || ours)) return;
          var f = document.getElementById("failure");
          if (!f || !f.hidden) return;
          f.hidden = false;
          document.getElementById("failure-reload").focus();
        },
        true,
      );
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #game {
        position: absolute;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        background: #000;
      }
      #debug-overlay {
        /* Bottom-left, over the floor: the top of the screen holds the health bars and names. */
        position: absolute;
        left: 0;
        bottom: 0;
        margin: 0;
        padding: 6px 8px;
        font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace;
        color: #e8ffe8;
        background: rgba(0, 0, 0, 0.6);
        pointer-events: none;
        white-space: pre;
      }
      #debug-overlay[hidden] {
        display: none;
      }
      /* Touch and phones (spec 015): an app, not a page. No pinch or double-tap
         zoom, no pull-to-refresh or bounce, no selection or long-press menu. */
      html,
      body {
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #game,
      #touch-controls,
      #rotate-screen {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #touch-controls {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        font-family: "Press Start 2P", ui-monospace, monospace;
      }
      #touch-controls[hidden],
      #touch-controls [hidden],
      #rotate-screen[hidden] {
        display: none;
      }
      .touch-dpad,
      .touch-btn {
        position: absolute;
        box-sizing: border-box;
        pointer-events: auto;
        touch-action: none;
      }
      .touch-dpad {
        border-radius: 50%;
        background: rgba(13, 12, 34, 0.42);
        border: 2px solid rgba(238, 237, 255, 0.28);
      }
      .touch-arm,
      .touch-hub {
        position: absolute;
        background: rgba(238, 237, 255, 0.2);
      }
      .touch-hub {
        left: 35%;
        top: 35%;
        width: 30%;
        height: 30%;
      }
      .touch-arm-up,
      .touch-arm-down {
        left: 35%;
        width: 30%;
        height: 29%;
      }
      .touch-arm-left,
      .touch-arm-right {
        top: 35%;
        width: 29%;
        height: 30%;
      }
      .touch-arm-up { top: 6%; border-radius: 6px 6px 0 0; }
      .touch-arm-down { bottom: 6%; border-radius: 0 0 6px 6px; }
      .touch-arm-left { left: 6%; border-radius: 6px 0 0 6px; }
      .touch-arm-right { right: 6%; border-radius: 0 6px 6px 0; }
      .touch-arm::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        border: 7px solid transparent;
        transform: translate(-50%, -50%);
      }
      .touch-arm-up::after { border-bottom-color: rgba(238, 237, 255, 0.75); border-top-width: 0; }
      .touch-arm-down::after { border-top-color: rgba(238, 237, 255, 0.75); border-bottom-width: 0; }
      .touch-arm-left::after { border-right-color: rgba(238, 237, 255, 0.75); border-left-width: 0; }
      .touch-arm-right::after { border-left-color: rgba(238, 237, 255, 0.75); border-right-width: 0; }
      .touch-arm.lit {
        background: rgba(255, 201, 74, 0.85);
        box-shadow: 0 0 10px rgba(255, 201, 74, 0.6);
      }
      .touch-knob {
        position: absolute;
        left: 37%;
        top: 37%;
        width: 26%;
        height: 26%;
        border-radius: 50%;
        background: rgba(238, 237, 255, 0.18);
        border: 2px solid rgba(238, 237, 255, 0.35);
        box-sizing: border-box;
      }
      .touch-dpad.active .touch-knob {
        background: rgba(255, 201, 74, 0.55);
        border-color: rgba(255, 201, 74, 0.9);
      }
      .touch-btn {
        --c: #eeedff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.06em;
        border-radius: 50%;
        background: rgba(13, 12, 34, 0.45);
        border: 0.045em solid var(--c);
        color: var(--c);
        line-height: 1;
        opacity: 0.88;
      }
      .touch-btn-punch { --c: #ffc94a; }
      .touch-btn-kick { --c: #ff6170; }
      .touch-btn-special { --c: #6fe3ff; }
      .touch-btn-throw { --c: #c39bff; }
      .touch-btn-pause {
        flex-direction: row;
        gap: 0.13em;
        border-radius: 22%;
        opacity: 0.75;
      }
      .touch-glyph { font-size: 0.3em; }
      .touch-btn-throw .touch-glyph { font-size: 0.2em; }
      .touch-caption { font-size: 0.115em; }
      .touch-pause-bar {
        width: 0.13em;
        height: 0.42em;
        background: currentColor;
      }
      .touch-btn.pressed {
        background: var(--c);
        color: #0d0c22;
        opacity: 1;
        transform: scale(0.94);
        box-shadow: 0 0 0.3em var(--c);
      }
      #rotate-screen {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: rgba(8, 7, 24, 0.94);
        color: #ffc94a;
        font: 14px/1.6 "Press Start 2P", ui-monospace, monospace;
        text-align: center;
      }
      #rotate-screen p {
        margin: 0 24px;
      }
      #rotate-screen .rotate-sub {
        color: #aeaadc;
        font-size: 8px;
      }
      .rotate-phone {
        width: 40px;
        height: 70px;
        border: 4px solid #eeedff;
        border-radius: 8px;
        box-sizing: border-box;
        animation: rotate-phone 2.4s ease-in-out infinite;
      }
      @keyframes rotate-phone {
        0%, 25% { transform: rotate(0deg); }
        55%, 100% { transform: rotate(-90deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .rotate-phone { animation: none; transform: rotate(-90deg); }
      }
    </style>
    <style>
      /* Spec 014: the failure and no-JavaScript screens, in the menus' colors and font; the screen-reader live region. */
      .shell-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: linear-gradient(#0b0a1f, #17154a 55%, #2a1f5c);
        color: #eeedff;
        font: 16px/1.75 "Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
        text-align: center;
      }
      .shell-screen[hidden] {
        display: none;
      }
      .shell-panel {
        max-width: 36em;
        padding: 24px 28px;
        background: rgba(13, 12, 34, 0.92);
        border: 1px solid #3e3a80;
        outline: 2px solid #0d0c22;
      }
      .shell-panel h1 {
        margin: 0 0 4px;
        font: inherit;
        font-size: 32px;
        line-height: 1.25;
        color: #ffc94a;
        text-shadow: 2px 2px 0 #0d0c22;
      }
      .shell-panel .shell-sub {
        margin: 0 0 24px;
        color: #ff6170;
      }
      .shell-panel p {
        margin: 0 0 16px;
      }
      .shell-panel .shell-detail {
        color: #aeaadc;
      }
      .shell-panel button {
        margin-top: 8px;
        padding: 12px 20px;
        font: inherit;
        color: #0d0c22;
        background: #ffc94a;
        border: 0;
        box-shadow: 4px 4px 0 #0d0c22;
        cursor: pointer;
      }
      .shell-panel button:hover,
      .shell-panel button:focus-visible {
        background: #fff1c2;
        outline: 2px solid #eeedff;
        outline-offset: 4px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="shell-screen" id="noscript">
        <div class="shell-panel">
          <h1>COMPASS</h1>
          <p class="shell-sub">CARDINAL CLASH</p>
          <p>This game needs JavaScript.</p>
          <p class="shell-detail">Turn JavaScript on for this site, then reload the page to play.</p>
        </div>
      </div>
    </noscript>
    <div class="shell-screen" id="failure" role="alert" aria-labelledby="failure-title" hidden>
      <div class="shell-panel">
        <h1>COMPASS</h1>
        <p class="shell-sub">CARDINAL CLASH</p>
        <p id="failure-title">The game could not start.</p>
        <p class="shell-detail" id="failure-detail">Something it needs did not load. Check your connection, then reload.</p>
        <button type="button" id="failure-reload" onclick="location.reload()">RELOAD</button>
      </div>
    </div>
    <canvas id="game" width="640" height="360"></canvas>
    <pre id="debug-overlay" hidden></pre>
    <div id="touch-controls" hidden></div>
    <div id="rotate-screen" hidden>
      <div class="rotate-phone"></div>
      <p>ROTATE YOUR DEVICE</p>
      <p class="rotate-sub">THE GAME PLAYS IN LANDSCAPE</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
